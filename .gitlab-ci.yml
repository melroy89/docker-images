stages:
  - build

variables:
  DOCKERHUB_REGISTRY: registry-1.docker.io
  DOCKERHUB_USERNAME: danger89

workflow:
  rules:
    - if: '$CI_PROJECT_NAMESPACE != "melroy"'
      when: never
    # Scheduled and manually triggered (web UI) pipelines rebuild everything
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_PIPELINE_SOURCE == "web"'
    # Pushes to the default branch only rebuild the images whose files changed
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

# Registry authentication, kept reusable so it can run again right before the
# pushes: `docker login` only establishes a session, and the registry issues a
# short-lived bearer token from it. An image build here can run for half an
# hour, which leaves plenty of room for the session established at job start to
# be useless by push time ("denied: requested access to the resource is
# denied").
.registry-login:
  script:
    # Docker Hub
    - echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin "$DOCKERHUB_REGISTRY"
    # Using GitLab deploy token
    - echo "$CI_DEPLOY_PASSWORD" | docker login -u "$CI_DEPLOY_USER" --password-stdin "$CI_REGISTRY"

default:
  # Allow newer pipelines to auto-cancel jobs of redundant older pipelines
  interruptible: true
  before_script:
    - !reference [.registry-login, script]

# Cap concurrent builds at ~4 to leave CI resources for other services on the
# host. GitLab has no native "max N" keyword, so we approximate it with 4
# `resource_group` pools (each runs one job at a time) and spread every job and
# matrix instance across them round-robin via .pool-N / the POOL matrix var.
.pool-1:
  resource_group: build-pool-1
.pool-2:
  resource_group: build-pool-2
.pool-3:
  resource_group: build-pool-3
.pool-4:
  resource_group: build-pool-4

# Shared build & push logic. Jobs set: BUILD_DIR, IMAGE_NAME, BUILD_ARGS
# and optionally DOCKERFILE (defaults to "Dockerfile").
# --pull ensures we always build on top of the latest (patched) base image,
# while still reusing the local layer cache when the base digest is unchanged.
.docker-build:
  stage: build
  tags:
    - shell
  variables:
    DOCKERFILE: Dockerfile
  script:
    - cd $BUILD_DIR
    - |
      docker build \
        --pull \
        --build-arg build_date="$(date -u +"%Y-%m-%dT%H:%M:%SZ")" \
        $BUILD_ARGS \
        -t $CI_REGISTRY_IMAGE/$IMAGE_NAME \
        -t $DOCKERHUB_REGISTRY/$DOCKERHUB_USERNAME/$IMAGE_NAME \
        -f $DOCKERFILE .
    # Re-authenticate against both registries: the build above can easily take
    # 30+ minutes, so do not rely on the login from before_script still being
    # good. Cheap (a couple of seconds) compared to redoing the build.
    - !reference [.registry-login, script]
    - docker push $CI_REGISTRY_IMAGE/$IMAGE_NAME
    - docker push $DOCKERHUB_REGISTRY/$DOCKERHUB_USERNAME/$IMAGE_NAME

pnpm-alpine:build:
  extends:
    - .docker-build
    - .pool-1
  parallel:
    matrix:
      # LTS releases only for now (only major version)
      - NODE_VERSION: ["24"]
        # Important: No array for PNPM_VERSION
        PNPM_VERSION: "11.13.0"
  variables:
    BUILD_DIR: pnpm
    IMAGE_NAME: pnpm:${NODE_VERSION}
    BUILD_ARGS: >-
      --build-arg node_version=${NODE_VERSION}
      --build-arg pnpm_version=${PNPM_VERSION}
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" || $CI_PIPELINE_SOURCE == "web"'
    - changes:
        - pnpm/**/*
        - .gitlab-ci.yml

pnpm-debian:build:
  extends:
    - .docker-build
    - .pool-2
  parallel:
    matrix:
      # Only build latest LTS version for now (major + minor node.js version)
      - NODE_VERSION: "24.18.0"
        # Important: No array for DEBIAN_VERSION (just use latest stable)
        DEBIAN_VERSION: "trixie"
        # Important: No array for PNPM_VERSION
        PNPM_VERSION: "11.13.0"
  variables:
    BUILD_DIR: debian-pnpm
    IMAGE_NAME: debian-pnpm:${NODE_VERSION}-${DEBIAN_VERSION}
    BUILD_ARGS: >-
      --build-arg node_version=${NODE_VERSION}
      --build-arg debian_version=${DEBIAN_VERSION}
      --build-arg pnpm_version=${PNPM_VERSION}
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" || $CI_PIPELINE_SOURCE == "web"'
    - changes:
        - debian-pnpm/**/*
        - .gitlab-ci.yml

cmake-debian:build:
  extends:
    - .docker-build
    # Dedicated pool: all Debian versions build one at a time (CPU-heavy).
    - .pool-1
  parallel:
    matrix:
      # Debian versions to build.
      - DEBIAN_VERSION: ["bookworm", "trixie", "forky"]
        # Important: No array for CPPCHECK_VERSION and CMAKE_VERSION
        CPPCHECK_VERSION: "2.21.0"
        CMAKE_VERSION: "4.2.1"
  variables:
    BUILD_DIR: cmake
    DOCKERFILE: debian.Dockerfile
    IMAGE_NAME: cmake:${DEBIAN_VERSION}-cppcheck-${CPPCHECK_VERSION}
    BUILD_ARGS: >-
      --build-arg debian_version=${DEBIAN_VERSION}
      --build-arg cppcheck_version=${CPPCHECK_VERSION}
      --build-arg cmake_version=${CMAKE_VERSION}
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" || $CI_PIPELINE_SOURCE == "web"'
    - changes:
        - cmake/**/*
        - .gitlab-ci.yml

cmake-ubuntu:build:
  extends:
    - .docker-build
    # Dedicated pool: all Ubuntu versions build one at a time (CPU-heavy).
    - .pool-2
  parallel:
    matrix:
      # Ubuntu versions to build (incl. 26.04 LTS "resolute").
      - UBUNTU_VERSION: ["noble", "plucky", "resolute"]
        # Important: No array for CPPCHECK_VERSION and CMAKE_VERSION
        CPPCHECK_VERSION: "2.21.0"
        CMAKE_VERSION: "4.3.2"
  variables:
    BUILD_DIR: cmake
    DOCKERFILE: ubuntu.Dockerfile
    IMAGE_NAME: cmake:${UBUNTU_VERSION}-cppcheck-${CPPCHECK_VERSION}
    BUILD_ARGS: >-
      --build-arg ubuntu_version=${UBUNTU_VERSION}
      --build-arg cppcheck_version=${CPPCHECK_VERSION}
      --build-arg cmake_version=${CMAKE_VERSION}
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" || $CI_PIPELINE_SOURCE == "web"'
    - changes:
        - cmake/**/*
        - .gitlab-ci.yml

# The gtk images build FROM the cmake images. Split into a Debian and an
# Ubuntu job so each only waits for its own base images. The needs are
# optional: when the cmake jobs are skipped (no changes), the previously
# pushed cmake image from the registry is used instead.
gtk-cmake-ninja-debian:build:
  extends:
    - .docker-build
    # Dedicated pool: all Debian versions build one at a time (CPU-heavy).
    - .pool-3
  needs:
    - job: "cmake-debian:build"
      optional: true
  parallel:
    matrix:
      # Provide multiple GTK versions (both are installed in the same image), comma separated.
      - GTK_VERSIONS: "3.0,4.0"
        DISTRO_VERSION: ["bookworm", "trixie", "forky"]
        # Important: No array for CPPCHECK_VERSION
        CPPCHECK_VERSION: "2.21.0"
  variables:
    BUILD_DIR: gtk-cmake-ninja
    IMAGE_NAME: gtk-cmake-ninja:${DISTRO_VERSION}
    BUILD_ARGS: >-
      --build-arg distro_version=${DISTRO_VERSION}
      --build-arg cppcheck_version=${CPPCHECK_VERSION}
      --build-arg gtk_versions=${GTK_VERSIONS}
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" || $CI_PIPELINE_SOURCE == "web"'
    # Also rebuild when the cmake base images change
    - changes:
        - gtk-cmake-ninja/**/*
        - cmake/**/*
        - .gitlab-ci.yml

gtk-cmake-ninja-ubuntu:build:
  extends:
    - .docker-build
    # Dedicated pool: all Ubuntu versions build one at a time (CPU-heavy).
    - .pool-4
  needs:
    - job: "cmake-ubuntu:build"
      optional: true
  parallel:
    matrix:
      # Provide multiple GTK versions (both are installed in the same image), comma separated.
      # Distro versions incl. Ubuntu 26.04 LTS "resolute".
      - GTK_VERSIONS: "3.0,4.0"
        DISTRO_VERSION: ["noble", "plucky", "resolute"]
        # Important: No array for CPPCHECK_VERSION
        CPPCHECK_VERSION: "2.21.0"
  variables:
    BUILD_DIR: gtk-cmake-ninja
    IMAGE_NAME: gtk-cmake-ninja:${DISTRO_VERSION}
    BUILD_ARGS: >-
      --build-arg distro_version=${DISTRO_VERSION}
      --build-arg cppcheck_version=${CPPCHECK_VERSION}
      --build-arg gtk_versions=${GTK_VERSIONS}
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" || $CI_PIPELINE_SOURCE == "web"'
    # Also rebuild when the cmake base images change
    - changes:
        - gtk-cmake-ninja/**/*
        - cmake/**/*
        - .gitlab-ci.yml

php:build:
  extends:
    - .docker-build
    - .pool-3
  variables:
    PHP_VERSION: "8.5"
    BUILD_DIR: php
    IMAGE_NAME: php:${PHP_VERSION}
    BUILD_ARGS: >-
      --build-arg php_version=${PHP_VERSION}
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" || $CI_PIPELINE_SOURCE == "web"'
    - changes:
        - php/**/*
        - .gitlab-ci.yml

rust:build:
  extends:
    - .docker-build
    - .pool-4
  variables:
    RUST_VERSION: "1.95"
    NODE_VERSION: "24.18.0"
    PNPM_VERSION: "11.13.0"
    BUILD_DIR: rust
    IMAGE_NAME: rust:${RUST_VERSION}-node-${NODE_VERSION}
    BUILD_ARGS: >-
      --build-arg rust_version=${RUST_VERSION}
      --build-arg node_version=${NODE_VERSION}
      --build-arg pnpm_version=${PNPM_VERSION}
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" || $CI_PIPELINE_SOURCE == "web"'
    - changes:
        - rust/**/*
        - .gitlab-ci.yml
